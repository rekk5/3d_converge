# 3D Converge Pipeline configuration
# Control the full pipeline from a single YAML file (no code changes required)

# General
project_name: vggt_project
output_dir: /home/t/Desktop/3d_converge/output

# Input data
image_path: /path/to/images_or_video
point_cloud_path: null  # optional: use an existing PLY to skip reconstruction

# Reconstruction
recon_method: vggt  # choices: vggt, mast3r, colmap, tsdf, none

# VGGT parameters
vggt:
  conf_threshold: 3.0
  fps: 1.0
  show_cameras: true

# TSDF parameters (only if recon_method=tsdf)
tsdf:
  tsdf_data_path: /path/to/tsdf_dataset_root
  voxel_length: 0.01
  sdf_trunc: 0.04

# Segmentation
segmentation:
  enabled: true
  voxel_size: 0.03
  max_planes: 60
  distance_threshold: 0.04
  enhanced: false

# Diffraction
diffraction:
  enabled: true
  method: segmentation  # choices: segmentation, normals
  angle_threshold: 45.0
  min_edge_length: 0.1
  normals:
    normal_radius: 0.05
    normal_max_nn: 30
    edge_radius: 0.05
    voxel_downsampling: 0.02
    sor_neighbors: 20
    sor_std_ratio: 2.0

# Comparison (optional)
comparison:
  enabled: false
  base_cloud_path: /path/to/base_cloud.ply
  threshold: 0.15
  voxel_size: 0.02
  selective_segmentation: false
  enhanced: true
  use_multi_scale: true
  use_confidence: true
  use_color_coding: true
